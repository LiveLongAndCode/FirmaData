name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            solution/**/*.csproj
            solution/Directory.Packages.props

      - name: Restore
        working-directory: solution
        run: dotnet restore FirmaData.sln

      # TreatWarningsAsErrors + EnforceCodeStyleInBuild (Directory.Build.props) turn analyzer
      # warnings into build failures here, so no extra flag is needed to gate on them.
      - name: Build
        working-directory: solution
        run: dotnet build FirmaData.sln --configuration Release --no-restore

      - name: Test
        working-directory: solution
        run: >
          dotnet test FirmaData.sln
          --configuration Release
          --no-build
          --filter "Category!=Live"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publish test results to job summary
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: solution/TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: solution/TestResults/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both

      - name: Append coverage to job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker (${{ matrix.service }})
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: solution/src/Backend/FirmaData.Api/Dockerfile
          - service: web
            dockerfile: solution/src/Frontend/FirmaData.Web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # ghcr.io repository paths must be lowercase; the GitHub org/repo name isn't guaranteed to be.
      - name: Compute image tags
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$IMAGE:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # PRs build the image to prove the Dockerfile still works, but never push -- only main
      # publishes to GHCR, so untrusted PR branches can't land arbitrary images in the registry.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./solution
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.vars.outputs.sha_tag }}
            ${{ steps.vars.outputs.latest_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Nice-to-have per the build plan: informational only, never blocks the pipeline.
      - name: Trivy scan
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.sha_tag }}
          format: table
          exit-code: "0"
